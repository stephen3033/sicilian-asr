[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "sicilian-asr"
version = "0.1.0"
description = "Local Italian and Sicilian speech recognition through IPA and WFST decoding"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
license-files = ["LICENSE", "docs/NOTICE", "docs/licenses/Apache-2.0.txt"]
dependencies = ["pyyaml==6.0.3"]

[project.scripts]
sicilian-asr = "pipeline.cli:main"

[project.optional-dependencies]
corpus = [
  "fluent.syntax==0.19.0",
  "pypdf==6.1.1",
  "polib==1.2.0",
  "pyarrow==19.0.1",
  "rdflib==7.2.1",
  "mwparserfromhell==0.7.2",
  "pymupdf==1.26.7",
  "yt-dlp==2026.8.19",
  "cmake==3.31.6",
]
research = [
  "numpy==1.26.4",
  "torch==2.4.0",
  "torchaudio==2.4.0",
  "k2==1.24.4.dev20260625+cpu.torch2.4.0",
  "kenlm==0.3.0",
  "kaldilm==1.15.4",
  "lhotse==1.33.0",
  "sentencepiece==0.2.2",
  "soundfile==0.14.0",
  "kaldialign==0.12.0",
  "pypinyin==0.50.0",
  "tensorboard==2.21.0",
  "wandb==0.30.0",
]

[dependency-groups]
dev = ["pytest==9.1.1"]

[tool.uv]
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]
build-constraint-dependencies = ["cmake==3.31.6", "setuptools==75.8.2", "wheel==0.45.1"]

[tool.uv.sources]
k2 = { url = "https://huggingface.co/csukuangfj2/k2/resolve/566a071486bde284bedcf41a8e3dc92340ec81bc/macos/1.24.4.dev20260625/k2-1.24.4.dev20260625+cpu.torch2.4.0-cp312-cp312-macosx_11_0_arm64.whl" }

[tool.hatch.build.targets.wheel]
packages = ["src/common", "src/media_input", "src/audio", "src/ipa", "src/asr", "src/evaluation", "src/pipeline"]
exclude = ["**/__pycache__/**", "**/*.pyc", "**/.DS_Store", "**/*.arpa", "**/*.pt", "**/*.pth"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/configs", "/resources", "/docs", "/tests", "/scripts", "/README.md", "/LICENSE", "/pyproject.toml", "/uv.lock", "/.python-version"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --import-mode=importlib"
