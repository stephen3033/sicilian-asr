[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "sicilian-asr"
version = "0.1.0"
description = "Research scaffolding for Italian–Sicilian speech-to-IPA-to-grapheme ASR"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = ["pyyaml==6.0.3"]

[project.optional-dependencies]
research = [
  "numpy==1.26.4",
  "torch==2.4.0",
  "torchaudio==2.4.0",
  "k2==1.24.4.dev20260625+cpu.torch2.4.0",
  "kenlm==0.3.0",
  "lhotse==1.33.0",
  "sentencepiece==0.2.2",
  "soundfile==0.14.0",
  "kaldialign==0.12.0",
  "pypinyin==0.50.0",
  "tensorboard==2.21.0",
  "wandb==0.30.0",
]

[dependency-groups]
dev = ["pytest==9.1.1"]

[tool.uv]
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]
build-constraint-dependencies = ["cmake==3.31.6", "setuptools==75.8.2", "wheel==0.45.1"]

[tool.uv.sources]
k2 = { url = "https://huggingface.co/csukuangfj2/k2/resolve/566a071486bde284bedcf41a8e3dc92340ec81bc/macos/1.24.4.dev20260625/k2-1.24.4.dev20260625+cpu.torch2.4.0-cp312-cp312-macosx_11_0_arm64.whl" }

[tool.hatch.build.targets.wheel]
packages = ["src/sicilian_asr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
