# Paths are relative to the repository root. Null means not acquired/implemented.
schema_version: 1
acoustic:
  backend: zipa_pytorch
  model_id: anyspeech/zipa-large-crctc-ns-800k
  revision: 861eed23d6dbffd72c80e3d3fb12caefc0bf2f1a
  checkpoint_resource: zipa_checkpoint
  checkpoint_path: .cache/models/zipa-cr-ns-large-800k/zipa_large_crctc_0.5_scale_800000_avg10.pth
  vocabulary_resource: zipa_tokens
  vocabulary_path: .cache/models/zipa-cr-ns-large-800k/tokens.txt
  tokenizer_resource: zipa_tokenizer
  tokenizer_path: .cache/models/zipa-cr-ns-large-800k/unigram_127.model
  vocabulary_size: 127
  blank_id: 0
  sample_rate: 16000
  feature_bins: 80
  output_type: log_probabilities
  device: cpu
  threads: 4
  # MPS is a separately validated option, never a silent fallback.
  mps_status: failed_validation_on_pinned_stack
  inventory_mapping_path: null
languages: [ita]
output_language: ita
resources:
  ita:
    lexicon_resource: phonitalia_ipa
    lexicon_path: resources/ita/lexicon/italian.dict
    lexicon_format: phonitaliar_ipa_tsv
    lm_resource: mls_ita_lm
    lm_path: .cache/downloads/mls_lm_italian.tar.gz
    arpa_path: resources/ita/lm/mls/3-gram_lm.arpa
    lm_directory: resources/ita/lm
    lm_status: pretrained
decoder:
  backend: k2
  device: cpu
  enabled: true
  graph_path: .cache/graphs/ita
  vocabulary_size: 20000  # null selects the full shared vocabulary
  ctc_topology: compact
  inventory_compatibility: phonitalia_zipa_v1
  # Validated on frozen neutral development/test splits; preserve source forms.
  pronunciation_variants: true
  contractions: true
  acoustic_scale: 1.0
  lm_scale: 1.0
  search_beam: 20.0
  output_beam: 8.0
  min_active_states: 30
  max_active_states: 10000
audio:
  stream: null  # absolute FFprobe stream index; null selects first audio
  target_seconds: 20.0
  max_seconds: 24.0
  search_seconds: 4.0
  silence_seconds: 0.3
  silence_dbfs: -40.0
exports:
  probabilities: false
language_switching:
  enabled: false
  implementation: reserved

